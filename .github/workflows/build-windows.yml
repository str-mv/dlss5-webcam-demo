name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NVIDIA DLSS SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external | Out-Null
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git external/DLSS

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://github.com/microsoft/onnxruntime/releases/download/v1.29.0/onnxruntime-win-x64-1.29.0.zip `
            -OutFile ort.zip

          Expand-Archive ort.zip -DestinationPath ort

          New-Item -ItemType Directory -Force external | Out-Null
          Move-Item `
            ort/onnxruntime-win-x64-1.29.0 `
            external/onnxruntime

      - name: Configure and build with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          Write-Host "Visual Studio: $vs"

          $devcmd = Join-Path $vs "Common7\Tools\VsDevCmd.bat"

          cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 && cmake -S . -B build -G `"NMake Makefiles`" -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel"

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse |
            Where-Object {
              $_.Name -match "DLSSCamDemo|onnxruntime|nvngx"
            } |
            Select-Object FullName

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null

          Copy-Item build/DLSSCamDemo.exe artifact/
          Copy-Item build/onnxruntime.dll artifact/
          Copy-Item build/nvngx_dlss.dll artifact/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DLSSCamDemo-win64
          path: artifact/
          if-no-files-found: error
